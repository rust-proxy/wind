[package]
name = "wind-naive"
version.workspace = true
edition.workspace = true

[features]
# Dynamic mode (default): load libcronet at runtime via dlopen / LoadLibrary.
# Works on Linux, Windows, Android, and macOS with a shared library; iOS/tvOS
# have no shared Cronet build.
default = []
dynamic = ["cronet-rs/dynamic"]
# Static link mode: link libcronet.a at compile time (the default on Apple
# targets). `dynamic` wins when both features are enabled.
static-link = ["cronet-rs/static-link"]
# Build-time auto-download: have `cronet-sys`'s build script fetch and
# SHA-256-verify the matching prebuilt libcronet into OUT_DIR, so no manual
# `libcronet` install is required.
download = ["cronet-rs/download"]
# Download only when the selected backend is static.
download-static = ["cronet-rs/download-static"]

[dependencies]
# Cronet-based networking
cronet-rs = { git = "https://github.com/rust-proxy/cronet-rs", rev = "b0d830890ca50adb98c67cb64eca4e2161f8cbb3", default-features = false }

# Wind core abstractions
wind-core = { path = "../wind-core" }

# Async runtime
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["net", "sync", "io-util", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }

# Error handling
eyre = "0.6"
tracing = "0.1"

# Standard lib
bytes = "1"

# Socket policy: SO_BINDTODEVICE/SO_MARK on Linux, IP_BOUND_IF on Apple.
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(windows)'.dependencies]
# IP_UNICAST_IF / IPV6_UNICAST_IF are only exposed through WinSock.
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
# The bridge regression test needs a multi-thread runtime: it has to block its
# own thread waiting for the bridge's I/O thread while that task and the thread
# make progress elsewhere.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-util", "time"] }
rcgen = "0.14"
serde_json = "1"
bollard = "0.21"
futures-util = "0.3"
tar = { version = "0.4", default-features = false }
url = "2"
time = "0.3"
